 
<header class="page-header">
  <div class="container"><h1>Welcome to FixFlow</h1><p class="mb-0">Login or create an account to manage your bookings.</p></div>
</header>

<section class="section">
  <div class="container">
    <div class="row justify-content-center"><div class="col-md-8 col-lg-6">
      <div class="form-card">

         
        <div class="alert alert-warning d-flex align-items-center gap-2 mb-4 d-none" id="loginBookingNotice">
          <i class="bi bi-info-circle-fill text-warning fs-5"></i>
          <div>Please login or create an account to proceed with your service booking.</div>
        </div>

        <ul class="nav nav-tabs auth-tabs justify-content-center mb-4">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabLogin" type="button">Login</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabRegister" type="button">Register</button></li>
        </ul>

        <div class="tab-content">
           
          <div class="tab-pane fade show active" id="tabLogin">
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label class="form-label fw-semibold" for="loginEmail">Email</label>
                <input id="loginEmail" type="email" class="form-control" placeholder="you@example.com">
                <div class="error-msg" id="err-loginEmail"></div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold" for="loginPass">Password</label>
                <div class="input-group">
                  <input id="loginPass" type="password" class="form-control" placeholder="At least 6 characters">
                  <button type="button" class="btn btn-outline-secondary" data-pass="loginPass" aria-label="Show password"><i class="bi bi-eye"></i></button>
                </div>
                <div class="error-msg" id="err-loginPass"></div>
              </div>
              <div class="alert alert-danger d-none" id="loginMsg"></div>
              <button class="btn btn-fix w-100" type="submit">Login</button>
            </form>
          </div>

           
          <div class="tab-pane fade" id="tabRegister">
            <form id="registerForm" novalidate>
              <div class="mb-3"><label class="form-label fw-semibold" for="regName">Full name</label>
                <input id="regName" class="form-control"><div class="error-msg" id="err-regName"></div></div>
              <div class="mb-3"><label class="form-label fw-semibold" for="regEmail">Email</label>
                <input id="regEmail" type="email" class="form-control"><div class="error-msg" id="err-regEmail"></div></div>
              <div class="mb-3"><label class="form-label fw-semibold" for="regPhone">Mobile number</label>
                <input id="regPhone" class="form-control" placeholder="0300-1234567"><div class="error-msg" id="err-regPhone"></div></div>
              <div class="mb-3"><label class="form-label fw-semibold" for="regPass">Password</label>
                <div class="input-group"><input id="regPass" type="password" class="form-control">
                <button type="button" class="btn btn-outline-secondary" data-pass="regPass" aria-label="Show password"><i class="bi bi-eye"></i></button></div>
                <div class="error-msg" id="err-regPass"></div></div>
              <div class="mb-3"><label class="form-label fw-semibold" for="regPass2">Confirm password</label>
                <input id="regPass2" type="password" class="form-control"><div class="error-msg" id="err-regPass2"></div></div>
              <button class="btn btn-fix w-100" type="submit">Create Account</button>
            </form>
          </div>
        </div>
      </div>
    </div></div>
  </div>
</section>
